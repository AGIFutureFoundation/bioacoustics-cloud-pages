<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
<title id="t">Open bioacoustics archives by size (audio recordings or records)</title>
<desc id="d">Log-scale bar chart. Macaulay Library 3.2 million plus audio recordings; Xeno-canto about 1.04 million recordings; FrogID Dataset 7.0 more than 1 million records; Watkins Marine Mammal Sound Database more than 15,000 annotated clips.</desc>
<rect width="680" height="340" fill="#ffffff"/>
<text x="30" y="30" font-family="sans-serif" font-size="17" font-weight="bold" fill="#0b2a33">Open bioacoustics archives, by size</text>
<text x="30" y="52" font-family="sans-serif" font-size="12" fill="#4a6570">Audio recordings or validated records held. Log scale (base 10) — bars show orders of magnitude.</text>
<!-- rows: label x=30, bar starts x=190, plot width 440 for log 4..7 -->
<text x="30" y="102" font-family="sans-serif" font-size="13" fill="#0b2a33">Macaulay Library</text>
<rect x="190" y="86" width="357" height="24" fill="#0e7490"/>
<text x="553" y="103" font-family="sans-serif" font-size="12" fill="#0b2a33">3,200,000+</text>
<text x="30" y="152" font-family="sans-serif" font-size="13" fill="#0b2a33">Xeno-canto</text>
<rect x="190" y="136" width="295" height="24" fill="#0891b2"/>
<text x="491" y="153" font-family="sans-serif" font-size="12" fill="#0b2a33">~1,040,000</text>
<text x="30" y="202" font-family="sans-serif" font-size="13" fill="#0b2a33">FrogID (Dataset 7.0)</text>
<rect x="190" y="186" width="293" height="24" fill="#22a06b"/>
<text x="489" y="203" font-family="sans-serif" font-size="12" fill="#0b2a33">1,000,000+</text>
<text x="30" y="252" font-family="sans-serif" font-size="13" fill="#0b2a33">Watkins (WHOI)</text>
<rect x="190" y="236" width="26" height="24" fill="#b45309"/>
<text x="222" y="253" font-family="sans-serif" font-size="12" fill="#0b2a33">15,000+</text>
<text x="190" y="292" font-family="sans-serif" font-size="11" fill="#4a6570">10,000</text>
<text x="330" y="292" font-family="sans-serif" font-size="11" fill="#4a6570">100,000</text>
<text x="470" y="292" font-family="sans-serif" font-size="11" fill="#4a6570">1,000,000</text>
<text x="600" y="292" font-family="sans-serif" font-size="11" fill="#4a6570">10,000,000</text>
<text x="30" y="322" font-family="sans-serif" font-size="11" fill="#4a6570">Sources: Cornell Lab of Ornithology (Macaulay Library, Nov 2026); xeno-canto.org collection statistics; Australian Museum FrogID Dataset 7.0; Sayigh et al. 2016 (Watkins). Counts are snapshots that grow over time.</text>
</svg>
